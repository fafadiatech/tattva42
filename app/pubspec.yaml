name: tattva42
description: "Tattva42 — a second brain prototype for capturing and searching conversations."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.4.0
  go_router: ^13.0.0
  intl: ^0.19.0
  record: ^6.0.0
  just_audio: ^0.9.0
  permission_handler: ^11.0.0
  path_provider: ^2.1.0
  speech_to_text: ^7.0.0
  google_fonts: ^6.0.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/app_icon.png
  adaptive_icon_background: "#F6F7FC"
  adaptive_icon_foreground: assets/branding/app_icon.png
  remove_alpha_ios: true

flutter:
  uses-material-design: true
  assets:
    - assets/branding/app_icon.png
