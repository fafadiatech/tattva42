version: '3.9'

services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: tattva42
      POSTGRES_USER: tattva42
      POSTGRES_PASSWORD: tattva42dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
      - media_data:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=dev-secret-key-change-in-production
      - DATABASE_URL=postgres://tattva42:tattva42dev@db:5432/tattva42
      - DJANGO_SETTINGS_MODULE=config.settings.development
    depends_on:
      - db

volumes:
  postgres_data:
  media_data:
